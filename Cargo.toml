[package]
name = "patient-360-dashboard"
description = "Clinical Copilot — multi-source aggregation, priority queue, AI synthesis, physician review"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
chrono = { version = "0.4.45", features = ["serde"] }
